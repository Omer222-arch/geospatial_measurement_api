[project]
name = "aereo-geospatial-measurement-api"
version = "3.2.0"
description = "Production-oriented geospatial file measurement API for the Aereo engineering assignment"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "shapely>=2.0,<3.0",
  "pyproj>=3.7,<4.0",
  "pyshp>=2.3,<3.0",
  "defusedxml>=0.7.1,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
